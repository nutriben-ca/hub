<style>
/* Layout: barra de filtros fija arriba, franja de KPIs, pestañas; tabla densa tipo hoja de trabajo con panel de detalle */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eef2f8; --line:#dbe2ee; --fg:#14213d; --muted:#5b6782;
  --navy:#0033A1; --sky:#00A0DF; --accent:#FAA334; --accent-fg:#7a4300;
  --good:#1a7f4b; --warn:#b26b00; --bad:#b4372a;
  --c-nb:#0033A1; --c-abbott:#3d9be0; --c-nestle:#8c6d4f; --c-mj:#c2477a; --c-nutricia:#2f9c8f; --c-otros:#9aa3b5;
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif; --f-body:'Source Sans 3','Segoe UI',Arial,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --surface:#141d31; --surface2:#1b2640; --line:#28355a; --fg:#e7ecf6; --muted:#9aa6c2;
  --navy:#7fa2ff; --sky:#4cc3f0; --accent:#ffb44d; --accent-fg:#ffd59a; --good:#4cc488; --warn:#f0a63a; --bad:#ff7d6e;
  --c-nb:#7fa2ff; --c-abbott:#5fb3f0; --c-nestle:#c19a74; --c-mj:#e070a0; --c-nutricia:#4cc0b1; --c-otros:#8590a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#141d31; --surface2:#1b2640; --line:#28355a; --fg:#e7ecf6; --muted:#9aa6c2;
  --navy:#7fa2ff; --sky:#4cc3f0; --accent:#ffb44d; --accent-fg:#ffd59a; --good:#4cc488; --warn:#f0a63a; --bad:#ff7d6e;
  --c-nb:#7fa2ff; --c-abbott:#5fb3f0; --c-nestle:#c19a74; --c-mj:#e070a0; --c-nutricia:#4cc0b1; --c-otros:#8590a8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;max-width:1500px;margin:0 auto}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ctr{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
select,input[type=search],input[type=number]{font:inherit;font-size:13px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:210px}
input[type=number]{width:56px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface2);color:var(--fg);padding:6px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:700;font-size:14px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.t-abierto{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.t-abandono{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.t-riesgo{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.t-desarrollo{background:color-mix(in srgb,var(--sky) 15%,transparent);color:var(--sky);border-color:color-mix(in srgb,var(--sky) 40%,transparent)}
.t-defender{background:color-mix(in srgb,var(--navy) 14%,transparent);color:var(--navy);border-color:color-mix(in srgb,var(--navy) 35%,transparent)}
.t-feudo{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.t-bajo{background:transparent;color:var(--muted);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;cursor:pointer;background:none;padding:0;border:0}
.chips button .pill{opacity:.45}
.chips button[aria-pressed=true] .pill{opacity:1}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:980px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th.r,td.r{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--sky) 6%,transparent)}
tbody tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nm{font-weight:700}
.meta{font-size:12px;color:var(--muted)}
.mr{font-size:10.5px;font-weight:700;color:var(--navy);background:color-mix(in srgb,var(--navy) 10%,transparent);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.inv{font-size:10.5px;font-weight:700;color:#fff;background:#7a3b9e;border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.inv.l{background:#5b6b7a}
.mr.no{color:var(--accent-fg);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.bar{display:flex;height:8px;border-radius:3px;overflow:hidden;background:var(--surface2);width:110px}
.bar i{display:block;height:100%}
.sc{display:flex;align-items:center;gap:6px}
.sc .tr{width:54px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.sc .tr i{display:block;height:100%;background:var(--navy)}
.up{color:var(--bad)} .dn{color:var(--good)} .fl{color:var(--muted)}
.add{font:inherit;font-size:16px;line-height:1;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--navy);cursor:pointer}
.add[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#2a1700}
.more{display:block;margin:12px auto;font:inherit;font-weight:700;color:var(--navy);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 16px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;max-width:110ch}
.note b{color:var(--fg)}
/* detalle */
.dlg[hidden]{display:none!important}
.dlg{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 30px 18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.panel h2{font-family:var(--f-display);font-size:20px;margin:0 0 2px}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
.panel table{min-width:0}
.x{float:right;font:inherit;font-size:20px;background:none;border:0;color:var(--muted);cursor:pointer}
.act{background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:8px;padding:10px 12px;margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:13px;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface);color:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{font-family:var(--f-display);font-size:15px;margin:0 0 8px}
.mx td,.mx th{padding:6px 8px;font-size:12.5px}
.mx{min-width:640px}
.heat{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.plan-loc{font-family:var(--f-display);font-weight:700;font-size:15px;margin:16px 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted);margin-top:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
textarea{font:inherit;font-size:12.5px;width:100%;min-width:160px;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;resize:vertical}
@media (prefers-reduced-motion:no-preference){.panel{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(30px);opacity:.6}}}
</style>

a Al Oeste Media Al Sur La Trinidad","p":[["Pediasure","Abbott","Suplemento pediátrico",0,1,0,0]],"mr":[],"tier":"","pat":0,"ext":false,"emc":""},{"id":"1001675566","n":"Guevara Anaya Maria Mercedes","pais":"El Salvador","loc":"San Salvador","esp":"Pediatría","esp2":"","cat":5,"dom":"23 Cll Poniente Multiclinicas Farela #1502","p":[["Nutrilon Omneo C","Nutricia","Confort digestivo",0,1,0,0]],"mr":[],"tier":"","pat":0,"ext":false,"emc":""}],"meta":{"fuente":"Close Up / Analyzer, mercado V06C","periodo":"TAM 08/26 vs TAM 08/25; trimestres a 05/26 y 08/26","n":1695}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const SEGS=D.segs, LABS=['Abbott','Nestlé','Mead Johnson','Nutricia','Otros'];
const LABC={'Nutribén':'var(--c-nb)','Abbott':'var(--c-abbott)','Nestlé':'var(--c-nestle)','Mead Johnson':'var(--c-mj)','Nutricia':'var(--c-nutricia)','Otros':'var(--c-otros)'};
const TIPOS=[['abierto','Abierto a cambio'],['abandono','Dejó Nutribén'],['riesgo','Nutribén en riesgo'],['desarrollo','En desarrollo'],['defender','Defender'],['feudo','Leal a un competidor'],['bajo','Bajo volumen']];
const TNAME=Object.fromEntries(TIPOS);
const FREQ={abierto:2,abandono:2,riesgo:2,desarrollo:2,defender:1,feudo:1,bajo:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('es-HN');
const pct=n=>(n*100).toFixed(0)+'%';
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---------- métricas por médico ---------- */
D.docs.forEach(d=>{
  let t26=0,t25=0,nb26=0,nb25=0,nbq5=0,nbq8=0,c26=0,c25=0,cq5=0,cq8=0,cw=0,cnc=0,byLab={},bySeg={},best=null;
  d.p.forEach(([prod,lab,seg,a25,a26,q5,q8])=>{
    t26+=a26;t25+=a25;
    if(lab==='Nutribén'){nb26+=a26;nb25+=a25;nbq5+=q5;nbq8+=q8;return}
    const w=SEGS[seg].w;
    if(w>0){c26+=a26;c25+=a25;cq5+=q5;cq8+=q8;cw+=a26*w;byLab[lab]=(byLab[lab]||0)+a26;bySeg[seg]=(bySeg[seg]||0)+a26;
      if(a26>0&&(!best||a26*w>best.v))best={prod,lab,seg,rx:a26,v:a26*w};}
    else cnc+=a26;
  });
  const labs=Object.entries(byLab).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const top=labs[0]||['—',0], topSh=c26?top[1]/c26:0;
  const hhi=c26?labs.reduce((s,[,v])=>s+(v/c26)**2,0):1;
  const base=c26+nb26, sh26=base?nb26/base:0, sh25=(c25+nb25)?nb25/(c25+nb25):0;
  let tipo;
  if(c26<1&&nb26<1) tipo='bajo';
  else if(nb25>0&&nb26===0) tipo='abandono';
  else if(sh26>=0.4) tipo=(nbq5>=2&&nbq8<nbq5*0.7)?'riesgo':'defender';
  else if(sh26>=0.1) tipo=(nbq5>=2&&nbq8<nbq5*0.7)?'riesgo':'desarrollo';
  else if(topSh>=0.8&&c26>=6&&cq8>=cq5) tipo='feudo';
  else tipo='abierto';
  const mom=cq5===0&&cq8===0?0.5:(cq8<cq5?1:(cq8===cq5?0.5:0));
  const apert=((1-topSh)+mom+((nb26>0||nb25>0)?1:0))/3*(sh26>=0.4?0.5:1);
  d.intl=!!(d.ext&&d.pat>0&&c26>0);
  Object.assign(d,{t26,t25,nb26,nb25,nbq5,nbq8,c26,c25,cq5,cq8,cw,cnc,labs,top:top[0],topSh,hhi,sh26,sh25,tipo,apert,best,bySeg});
});
/* percentil del volumen ponderado dentro de cada país */
['Honduras','El Salvador','Nicaragua','Costa Rica'].forEach(p=>{
  const L=D.docs.filter(d=>d.pais===p).sort((a,b)=>a.cw-b.cw), n=L.length;
  L.forEach((d,i)=>{d.pv=n>1?i/(n-1):1});
  for(let i=0;i<n;){let j=i;while(j<n&&L[j].cw===L[i].cw)j++;const m=(L[i].pv+L[j-1].pv)/2;for(let k=i;k<j;k++)L[k].pv=m;i=j}
  L.forEach(d=>{d.score=d.c26<1?0:Math.round(100*(0.7*d.pv+0.3*d.apert))});
});

/* ---------- estado ---------- */
const ST=Object.assign({pais:'Honduras',tipos:TIPOS.map(t=>t[0]).filter(t=>t!=='bajo'),sort:'score',dir:-1,lim:60,tab:'pres'},store('rp_state')||{});
ST.lim=60;
let PLAN=store('rp_plan')||{};
const save=()=>{store('rp_state',{pais:ST.pais,tipos:ST.tipos,sort:ST.sort,dir:ST.dir});store('rp_plan',PLAN)};

/* ---------- filtros ---------- */
function opts(el,vals,all,cur){el.innerHTML='<option value="">'+all+'</option>'+vals.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('');}
function initFilters(){
  $('pais').innerHTML=['Honduras','El Salvador','Nicaragua','Costa Rica'].map(p=>`<button aria-pressed="${p===ST.pais}" data-p="${p}">${p}</button>`).join('');
  const P=D.docs.filter(d=>d.pais===ST.pais);
  const cnt=k=>{const m={};P.forEach(d=>{m[d[k]]=(m[d[k]]||0)+1});return Object.keys(m).sort((a,b)=>m[b]-m[a])};
  opts($('fLoc'),cnt('loc'),'Todas',$('fLoc').value);
  opts($('fEsp'),cnt('esp'),'Todas',$('fEsp').value);
  opts($('fLab'),LABS,'Todos',$('fLab').value);
  opts($('fSeg'),Object.keys(SEGS).filter(s=>SEGS[s].w>0),'Todos (con equivalente)',$('fSeg').value);
  const hasCart=P.some(d=>d.mr.length);
  const mrs={};P.forEach(d=>d.mr.forEach(m=>{mrs[m]=(mrs[m]||0)+1}));
  opts($('fMR'),Object.keys(mrs).sort(),'Todos',$('fMR').value);
  $('fMR').disabled=!hasCart; if(!hasCart)$('fMR').value='';
  $('fInv').disabled=!hasCart; if(!hasCart)$('fInv').value='';
  $('fCov').disabled=!hasCart; if(!hasCart)$('fCov').value='';
  $('fCov').title=hasCart?'':'La cartera de visitadores solo está cruzada para Honduras y El Salvador';
  $('tipos').innerHTML=TIPOS.map(([k,n])=>`<button aria-pressed="${ST.tipos.includes(k)}" data-t="${k}"><span class="pill t-${k}">${n}</span></button>`).join('');
}
function filtered(){
  const loc=$('fLoc').value,esp=$('fEsp').value,lab=$('fLab').value,seg=$('fSeg').value,cov=$('fCov').value,mn=+$('fMin').value||0,q=$('fQ').value.trim().toLowerCase();
  return D.docs.filter(d=>{
    if(d.pais!==ST.pais)return false;
    if(!ST.tipos.includes(d.tipo))return false;
    if(loc&&d.loc!==loc)return false; if(esp&&d.esp!==esp)return false;
    if(lab&&!(d.labs.find(x=>x[0]===lab)))return false;
    if(seg&&!(d.bySeg[seg]>0))return false;
    const mrf=$('fMR').value; if(mrf&&!d.mr.includes(mrf))return false; const inv=$('fInv').value; if(inv==='intl'&&!d.intl)return false; if(inv==='any'&&!(d.pat>0))return false; if(inv==='none'&&d.pat>0)return false;
    if(cov==='in'&&!d.mr.length)return false; if(cov==='out'&&d.mr.length)return false;
    if(d.c26<mn)return false;
    if(q&&!(d.n.toLowerCase().includes(q)||d.dom.toLowerCase().includes(q)))return false;
    return true;
  });
}
const labRx=(d,lab)=>lab?(d.labs.find(x=>x[0]===lab)||[0,0])[1]:d.c26;

/* ---------- KPIs ---------- */
function kpis(L){
  const lab=$('fLab').value;
  const c=L.reduce((s,d)=>s+labRx(d,lab),0), nb=L.reduce((s,d)=>s+d.nb26,0), base=L.reduce((s,d)=>s+d.c26+d.nb26,0);
  const c25=L.reduce((s,d)=>s+d.c25,0), c26=L.reduce((s,d)=>s+d.c26,0);
  const ab=L.filter(d=>d.tipo==='abierto'||d.tipo==='abandono').length;
  const fuera=L.filter(d=>!d.mr.length&&d.score>=70).length;
  const hasCart=D.docs.some(d=>d.pais===ST.pais&&d.mr.length);
  const nIntl=L.filter(d=>d.intl).length;
  $('kpis').innerHTML=[
    [fmt(L.length),'médicos en la selección'],
    [fmt(c),'Rx/año de '+(lab||'la competencia')+' con equivalente Nutribén'],
    [(c25?((c26/c25-1)*100).toFixed(0):0)+'%','crecimiento de la competencia vs. año anterior'],
    [base?pct(nb/base):'0%','participación de Nutribén en esas recetas'],
    [fmt(ab),'abiertos a cambio o que dejaron Nutribén'],
    hasCart?[fmt(fuera),'con puntaje ≥ 70 fuera de nuestra cartera']:['—','cartera no cruzada en este país'],
    hasCart?[fmt(nIntl),'✈ con apoyo internacional que recetan competencia']:['—','apoyo internacional: solo HN y SV']
  ].map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('');
}

/* ---------- vista prescriptores ---------- */
const COLS=[['score','Puntaje','r'],['n','Médico',''],['cat','Cat. CU','r'],['c26','Rx compet.','r'],['cw','Rx ponderado','r'],['trend','Tendencia compet.','r'],['sh26','Nutribén','r'],['top','Competidor principal',''],['tipo','Tipología','']];
function mixBar(d){
  const tot=d.c26+d.nb26; if(!tot)return '<div class="bar"></div>';
  const parts=[['Nutribén',d.nb26]].concat(d.labs);
  return '<div class="bar" title="'+esc(parts.map(([l,v])=>l+' '+v).join(' · '))+'">'+parts.map(([l,v])=>`<i style="width:${v/tot*100}%;background:${LABC[l]}"></i>`).join('')+'</div>';
}
function trendTxt(a,b){if(a===0&&b===0)return '<span class="fl">—</span>';const cls=b>a?'up':b<a?'dn':'fl';const ar=b>a?'▲':b<a?'▼':'■';return `<span class="num ${cls}">${a}→${b} ${ar}</span>`}
function renderPres(){
  let L=filtered();
  kpis(L);
  const k=ST.sort,dir=ST.dir,lab0=$('fLab').value;
  L.sort((a,b)=>{let x,y;if(k==='trend'){x=a.cq8-a.cq5;y=b.cq8-b.cq5}else if(k==='tipo'){x=TIPOS.findIndex(t=>t[0]===a.tipo);y=TIPOS.findIndex(t=>t[0]===b.tipo)}else if(k==='c26'){x=labRx(a,lab0);y=labRx(b,lab0)}else{x=a[k];y=b[k]}
    return (typeof x==='string'?x.localeCompare(y):(x-y))*dir||b.score-a.score});
  const lab=$('fLab').value;
  let h='<div class="tw"><table><thead><tr><th aria-label="Agregar al plan"></th>'+COLS.map(([c,t,r])=>`<th class="${r}" data-s="${c}">${t}${ST.sort===c?(dir<0?' ↓':' ↑'):''}</th>`).join('')+'</tr></thead><tbody>';
  L.slice(0,ST.lim).forEach(d=>{
    const inP=!!PLAN[d.id];
    const cart=d.mr.length?`<span class="mr">${esc(d.mr.join(', '))}${d.tier?' · '+d.tier.replace('TIER ','T'):''}</span>`:(['Honduras','El Salvador'].includes(d.pais)?'<span class="mr no">fuera de cartera</span>':'');
    const invb=`${d.intl?'<span class="inv" title="Inversión Nutribén con apoyo internacional (EMC Extranjero, patrocinio '+d.pat+' año(s) 2024-26) y receta competencia">✈ Apoyo intl.</span>':(d.pat>0?'<span class="inv l" title="Patrocinio Nutribén '+d.pat+' año(s) 2024-26">Patrocinado</span>':'')}`;
    const dsh=d.sh26-d.sh25;
    h+=`<tr data-id="${d.id}" class="${inP?'sel':''}"><td><button class="add" data-add="${d.id}" aria-pressed="${inP}" title="${inP?'Quitar del plan':'Agregar al plan'}">${inP?'✓':'+'}</button></td>
      <td><div class="sc"><span class="num">${d.score}</span><div class="tr"><i style="width:${d.score}%"></i></div></div></td>
      <td style="min-width:220px"><span class="nm">${esc(d.n)}</span>${cart}${invb}<div class="meta">${esc(d.esp)} · ${esc(d.loc)}</div></td>
      <td class="r num">${d.cat}</td>
      <td class="r num">${fmt(labRx(d,lab))}${lab?`<span class="meta"> / ${fmt(d.c26)}</span>`:''}</td>
      <td class="r num">${fmt(d.cw)}</td>
      <td class="r">${trendTxt(d.cq5,d.cq8)}</td>
      <td class="r"><div class="num">${pct(d.sh26)} <span class="meta">${d.nb26?'('+d.nb26+' Rx)':''}</span></div><div class="meta num ${dsh>0.001?'dn':dsh<-0.001?'up':''}">${dsh>0.001?'+':''}${(dsh*100).toFixed(0)} pts vs. año ant.</div></td>
      <td>${mixBar(d)}<div class="meta">${lab?esc(lab)+' '+(d.c26?pct(labRx(d,lab)/d.c26):'0%')+' de la compet.'+(d.top!==lab&&d.c26?' · principal: '+esc(d.top):''):esc(d.top)+' '+(d.c26?pct(d.topSh)+' de la compet.':'')}</div></td>
      <td><span class="pill t-${d.tipo}">${TNAME[d.tipo]}</span></td></tr>`;
  });
  h+='</tbody></table></div>';
  if(!L.length)h='<div class="empty">Ningún médico cumple estos filtros. Baja el mínimo de Rx o activa más tipologías.</div>';
  if(L.length>ST.lim)h+=`<button class="more" id="more">Mostrar ${Math.min(60,L.length-ST.lim)} más (${fmt(L.length-ST.lim)} restantes)</button>`;
  h+='<div class="legend">'+Object.entries(LABC).map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')+'</div>';
  h+='<p class="note">Rx = recetas en el año móvil a agosto 2026 (TAM). <b>Tendencia</b> compara las recetas de la competencia del trimestre a mayo con el de agosto; ▼ en verde es buena noticia para nosotros. Toca un médico para ver su detalle y la acción sugerida.</p>';
  h=`<div class="toolbar"><span><b class="num">${fmt(L.length)}</b> médicos en la selección</span><span style="flex:1"></span><button class="btn" id="xlsP">Descargar Excel</button></div>`+h;
  $('v-pres').innerHTML=h;
  $('xlsP').onclick=()=>exportPres(L);
}
function exportPres(L){

/* ---------- detalle ---------- */
function action(d){
  if(!d.best)return d.nb26?'Mantener la prescripción de Nutribén; no hay recetas de la competencia con equivalente.':'Sin recetas de la competencia con equivalente Nutribén.';
  const b=d.best, nb=SEGS[b.seg].nb;
  return `Desplazar <b>${esc(b.prod)}</b> (${esc(b.lab)}, ${b.rx} Rx/año, ${esc(b.seg.toLowerCase())}) con <b>Nutribén ${esc(nb)}</b>.`;
}
function why(d){
  const r=[];
  if(d.tipo==='abandono')r.push(`Recetó ${d.nb25} Rx de Nutribén el año anterior y ninguna este año: conviene averiguar el motivo antes de volver a ofrecer.`);
  if(d.tipo==='riesgo')r.push(`Sus recetas de Nutribén bajan de ${d.nbq5} a ${d.nbq8} entre trimestres.`);
  if(d.topSh<0.6&&d.c26>=3)r.push(`Reparte sus recetas entre ${d.labs.length} competidores; ninguno pasa de ${pct(d.topSh)}.`);
  if(d.topSh>=0.8&&d.c26>=3)r.push(`Concentra ${pct(d.topSh)} de sus recetas en ${d.top}: el cambio será lento y más caro.`);
  if(d.cq8<d.cq5)r.push(`La competencia pierde recetas con él: ${d.cq5} → ${d.cq8} por trimestre.`);
  if(d.cq8>d.cq5&&d.cq5>0)r.push(`La competencia gana recetas con él: ${d.cq5} → ${d.cq8} por trimestre.`);
  if(d.cnc>0)r.push(`Además receta ${d.cnc} Rx/año de productos sin equivalente Nutribén (suplementos o aminoácidos), que no cuentan en el puntaje.`);
  return r;
}

   <h3>Recetas por producto</h3><div style="overflow-x:auto"><table><thead><tr><th>Producto</th><th>Segmento</th><th class="r">TAM 08/25</th><th class="r">TAM 08/26</th><th class="r">Trim. may</th><th class="r">Trim. ago</th></tr></thead><tbody>`;

}

/* ---------- plan ---------- */
function togglePlan(id){
  if(PLAN[id])delete PLAN[id];
  else{const d=D.docs.find(x=>x.id===id);PLAN[id]={v:FREQ[d.tipo]||1,o:d.best?`Desplazar ${d.best.prod} con Nutribén ${SEGS[d.best.seg].nb}`:'Mantener Nutribén'}}
  save(); $('nPlan').textContent=Object.keys(PLAN).length?'('+Object.keys(PLAN).length+')':''; render();
}
function planRows(){return Object.keys(PLAN).map(id=>D.docs.find(d=>d.id===id)).filter(Boolean)}
function renderPlan(){
  const L=planRows();
  if(!L.length){$('v-plan').innerHTML='<div class="empty">El plan está vacío. En la pestaña Prescriptores, toca <b>+</b> junto a cada médico que quieras visitar; aquí se agrupan por localidad con la acción sugerida y las visitas al mes.</div>';return}

    h+=`<div class="plan-loc"><span>${esc(k)}</span><span class="meta">${G.length} médicos · ${G.reduce((s,d)=>s+(+PLAN[d.id].v||0),0)} visitas/mes</span></div><div class="tw" style="margin-top:0"><table><thead><tr><th>Médico</th><th>Tipología</th><th class="r">Rx compet.</th><th class="r">Nutribén</th><th>Objetivo</th><th class="r">Visitas/mes</th><th></th></tr></thead><tbody>`;
    G.forEach(d=>{h+=`<tr style="cursor:default"><td><span class="nm" data-open="${d.id}" style="cursor:pointer;text-decoration:underline dotted">${esc(d.n)}</span><div class="meta">${esc(d.esp)} · ${d.mr.length?esc(d.mr.join(', ')):'fuera de cartera'}${d.intl?' · <b style="color:#7a3b9e">✈ Apoyo intl.</b>':''}</div></td><td><span class="pill t-${d.tipo}">${TNAME[d.tipo]}</span></td><td class="r num">${d.c26}</td><td class="r num">${pct(d.sh26)}</td>

function exportPlan(){

function copyPlan(){
  const L=planRows().sort((a,b)=>a.loc.localeCompare(b.loc)||b.score-a.score);
  let t='Plan de visita V06C\n',cur='';
  L.forEach(d=>{if(d.loc!==cur){cur=d.loc;t+='\n'+d.loc+'\n'}t+=`- ${d.n} (${TNAME[d.tipo]}, ${d.c26} Rx compet.): ${PLAN[d.id].o} · ${PLAN[d.id].v} visitas/mes\n`});
  const done=()=>{$('cpy').textContent='Copiado';setTimeout(()=>{if($('cpy'))$('cpy').textContent='Copiar resumen'},1500)};
  try{navigator.clipboard.writeText(t).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){$('clrc').innerHTML='<textarea rows="8" style="margin-top:8px" readonly>'+esc(t)+'</textarea>';$('clrc').querySelector('textarea').select()}
}

/* ---------- competidores ---------- */
function renderComp(){
  const P=D.docs.filter(d=>d.pais===ST.pais);

    h+='</tbody></table></div></div>';

  <tr style="cursor:default"><td><span class="pill t-abierto">Abierto a cambio</span></td><td>Nutribén por debajo de 10% y sin un competidor dominante. Prioridad de conquista.</td></tr>
  <tr style="cursor:default"><td><span class="pill t-abandono">Dejó Nutribén</span></td><td>Recetó Nutribén el año anterior y este año no. Reconquista: primero entender por qué.</td></tr>
  <tr style="cursor:default"><td><span class="pill t-riesgo">Nutribén en riesgo</span></td><td>Receta Nutribén, pero bajó más de 30% entre trimestres.</td></tr>
  <tr style="cursor:default"><td><span class="pill t-desarrollo">En desarrollo</span></td><td>Nutribén entre 10% y 40%. Ampliar a más segmentos.</td></tr>
  <tr style="cursor:default"><td><span class="pill t-defender">Defender</span></td><td>Nutribén 40% o más.</td></tr>
  <tr style="cursor:default"><td><span class="pill t-feudo">Leal a un competidor</span></td><td>Un laboratorio concentra 80% o más de al menos 6 Rx/año y no va en caída. Cambio lento y caro.</td></tr>
  <tr style="cursor:default"><td><span class="pill t-bajo">Bajo volumen</span></td><td>Sin recetas de la competencia con equivalente. Oculto por defecto.</td></tr></tbody></table></div>
  <div class="card"><h3>Segmentos clínicos y producto Nutribén para responder</h3><table style="min-width:0"><thead><tr><th>Segmento</th><th>Nutribén</th><th class="r">Peso</th></tr></thead><tbody>${segs.map(([s,v])=>`<tr style="cursor:default"><td>${esc(s)}</td><td>${esc(v.nb)}</td><td class="r num">×${v.w}</td></tr>`).join('')}</tbody></table>
  <p class="note">La clasificación de cada producto de la competencia se hizo por su nombre comercial. Antirreflujo se asignó a Confort: confírmalo con el portafolio vigente.</p></div>
  <div class="card"><h3>Límites de los datos</h3><p>Close Up mide recetas que llegan a farmacias del panel; no cuenta muestras médicas ni compras fuera del panel. Close Up registra Nutribén como una sola línea (más Hidrolizada), así que no se ve qué producto Nutribén receta cada médico.</p><p class="note">La cartera de visitadores está cruzada por nombre con la Guía de Inversión EMC solo para Honduras y El Salvador.</p></div></div>`;
}

/* ---------- control ---------- */
function render(){
  $('nDocs').textContent=fmt(D.docs.filter(d=>d.pais===ST.pais).length)+' de '+fmt(D.docs.length);
  ['pres','comp','plan','met'].forEach(t=>{$('v-'+t).hidden=ST.tab!==t;$('tb-'+t).setAttribute('aria-selected',ST.tab===t)});
  if(ST.tab==='pres')renderPres(); else kpis(filtered());
  if(ST.tab==='comp')renderComp(); if(ST.tab==='plan')renderPlan(); if(ST.tab==='met')renderMet();
}
document.addEventListener('click',e=>{
  const t=e.target;
  const p=t.closest('[data-p]'); if(p){ST.pais=p.dataset.p;$('fLoc').value='';$('fEsp').value='';ST.lim=60;initFilters();save();render();return}
  const ty=t.closest('[data-t]'); if(ty){const k=ty.dataset.t;ST.tipos=ST.tipos.includes(k)?ST.tipos.filter(x=>x!==k):ST.tipos.concat(k);ty.setAttribute('aria-pressed',ST.tipos.includes(k));save();render();return}
  const ad=t.closest('[data-add]'); if(ad){e.stopPropagation();togglePlan(ad.dataset.add);return}
  const op=t.closest('[data-open]'); if(op){openDoc(op.dataset.open);return}
  const th=t.closest('th[data-s]'); if(th){const k=th.dataset.s;if(ST.sort===k)ST.dir*=-1;else{ST.sort=k;ST.dir=k==='n'||k==='cat'?1:-1}save();render();return}
  if(t.id==='more'){ST.lim+=60;render();return}
  const sg=t.closest('tr[data-seg]'); if(sg){$('fSeg').value=sg.dataset.seg;ST.tab='pres';render();return}
  const tr=t.closest('tr[data-id]'); if(tr&&!$('dlg').contains(t)){openDoc(tr.dataset.id);return}
  const tb=t.closest('[role=tab]'); if(tb){ST.tab=tb.id.slice(3);render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.o){PLAN[t.dataset.o].o=t.value;save();return}
  if(t.dataset.v){PLAN[t.dataset.v].v=+t.value||0;save();return}
  if(t.id==='fLab'){ST.sort='c26';ST.dir=-1;save()}
  if(['fLoc','fEsp','fLab','fSeg','fCov','fMR','fInv','fMin','fQ'].includes(t.id)){ST.lim=60;render()}
});
document.addEventListener('change',e=>{if(e.target.dataset.v&&ST.tab==='plan')renderPlan()});
Object.assign(window,{D,TIPOS,filtered,ST,PLAN});
initFilters();
$('nPlan').textContent=Object.keys(PLAN).length?'('+Object.keys(PLAN).length+')':'';
render();
</script>

</html>
